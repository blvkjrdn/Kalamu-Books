<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalamu Books</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#fff;--surf:#f5f5f5;--ink:#111;--mute:#707072;--line:#e5e5e5;--volt:#cdff00;--pos:#007d48;--neg:#d30005;--ochre:#f56a00;--hero:#111;
--display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Inter',system-ui,sans-serif;
--forest:var(--ink);--paper:var(--bg);--card:var(--surf);--hairline:var(--line);--inkSoft:var(--mute);--leaf:var(--pos);--brick:var(--neg)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0c;--surf:#1a1a1c;--ink:#fff;--mute:#9e9ea0;--line:#2a2a2d;--pos:#5fe3a1;--neg:#ff6b5e;--hero:#1f1f22}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.frame{max-width:760px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
.head{order:-2;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex:none}
.logo{font:800 28px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.logo i{font-style:normal;background:var(--volt);color:#111;padding:0 7px;margin-left:5px}
.gear{border:1.5px solid var(--line);background:none;border-radius:999px;padding:8px 15px;font:600 13px var(--body);color:var(--ink);cursor:pointer}
.content{flex:1;overflow-y:auto;padding:0 20px 28px;-webkit-overflow-scrolling:touch}
.content.in{animation:fade .3s}
.nav{flex:none;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font:600 10.5px var(--body);cursor:pointer;padding:4px 10px}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.active{color:var(--ink)}.nav button.active svg{stroke-width:2.6}
@media(min-width:760px){.nav{order:-1;justify-content:flex-start;gap:6px;border:0;padding:0 20px 14px}.nav button{flex-direction:row;font-size:14px;padding:9px 16px;border-radius:999px}.nav button.active{background:var(--ink);color:var(--bg)}.nav svg{width:18px;height:18px}}
h2.section{font:800 clamp(30px,6vw,42px)/.95 var(--display);text-transform:uppercase;margin:26px 0 0;letter-spacing:.01em}
.hdr-row h2.section{margin-top:8px}
p.sub{color:var(--mute);font-size:13px;margin:6px 0 16px}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
.hero{background:var(--hero);color:#fff;margin:0 -20px 16px;padding:26px 20px 24px}
.hero .lbl,.tile .lbl{display:block;font:600 12px var(--body);color:#a0a0a2}
.hero .big{font:800 clamp(58px,18vw,112px)/.9 var(--display);color:var(--volt);text-transform:uppercase;margin:8px 0 18px}
.hero .big.neg{color:#ff6b5e}
.hero .two{display:flex;gap:32px}.hero b{display:block;font:700 26px var(--display);margin-top:2px}
.quick{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tile{background:var(--surf);padding:16px}.tile .lbl{color:var(--mute);margin-bottom:6px}.tile b{font-size:18px}
.alert{width:100%;text-align:left;background:var(--volt);color:#111;border:0;padding:14px 16px;font:700 14px var(--body);margin-bottom:8px;cursor:pointer}
.chart{display:flex;gap:6px;height:170px;margin:16px 0 12px}
.col{flex:1;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--mute);font:600 12px var(--body)}
.col em{font-style:normal}.col.on{color:var(--ink)}.col:not(.on) .bars{opacity:.4}
.bars{flex:1;display:flex;align-items:flex-end;gap:3px;transition:opacity .2s}
.bar{display:block;flex:1;min-height:3px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.bar.in{background:var(--ink)}.bar.out{background:var(--ochre)}
.read{font-size:14px;margin:0 0 4px}.dot{display:inline-block;width:9px;height:9px;margin:0 5px 0 12px}
.card{background:var(--surf);padding:16px;margin-bottom:8px}
.money{font-family:var(--body);font-weight:700;font-variant-numeric:tabular-nums}
.money.leaf{color:var(--pos)}.money.brick{color:var(--neg)}.money.ink{color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font:700 14px var(--body);cursor:pointer;white-space:nowrap;transition:transform .12s}
.btn:active,.col:active,.alert:active{transform:scale(.96)}
.btn.ochre{background:var(--volt);color:#111}.btn.brick{background:var(--neg);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.seg{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.seg button{flex:none;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font:600 13px var(--body);color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{border-radius:999px;background:var(--surf);border:0;padding:13px 18px;margin-bottom:12px}
.stamp{display:inline-block;background:var(--pos);color:#fff;border-radius:999px;padding:4px 11px;font:700 11px var(--body);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.stamp.brick{background:var(--neg)}.stamp.ochre{background:var(--volt);color:#111}
.row-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row-item:last-child{border:0}
.empty{text-align:center;padding:64px 10px;color:var(--mute);font:700 24px var(--display);text-transform:uppercase}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;flex-direction:column;animation:fade .2s}
.sheet{margin:auto auto 0;width:100%;max-width:640px;background:var(--bg);border-radius:20px 20px 0 0;padding:22px 20px 28px;max-height:90vh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font:800 30px/1 var(--display);text-transform:uppercase;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 span.x{cursor:pointer;color:var(--mute);font-size:20px;padding:0 6px}
label.field{display:block;margin-bottom:12px}
label.field span{display:block;font:600 12.5px var(--body);color:var(--mute);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:13px 14px;color:var(--ink);font:16px var(--body)}
input:focus,select:focus{outline:none;border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-row{display:grid;grid-template-columns:2.2fr .7fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.item-row input{padding:10px 8px;font-size:14px}
.totalline{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.totalline.bold{font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
.icon-x{background:none;border:0;color:var(--mute);font-size:16px;cursor:pointer;padding:4px 8px}
.thumb{width:100%;margin-top:8px;max-height:140px;object-fit:cover}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font:600 13px var(--body);z-index:50;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pdfbtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font:600 12px var(--body);color:var(--ink);cursor:pointer}
a.linklike{color:var(--ink);text-decoration:underline;font:600 13px var(--body);cursor:pointer}
.bizbar{order:-2;flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 20px 12px;-webkit-overflow-scrolling:touch}
.bizbar::-webkit-scrollbar{display:none}
.bizchip{flex:none;display:flex;align-items:center;gap:6px;background:var(--surf);border:0;border-radius:999px;padding:8px 15px;font:600 12.5px var(--body);color:var(--mute);cursor:pointer;white-space:nowrap;transition:transform .12s}
.bizchip.active{background:var(--ink);color:var(--bg)}
.bizchip:active{transform:scale(.96)}
.bizchip .vdot{width:6px;height:6px;border-radius:50%;background:var(--volt);flex:none}
.bizadd{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--line);background:none;color:var(--mute);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bizadd:active{transform:scale(.9)}
.picon{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="frame">
  <header class="head"><div class="logo">Kalamu<i>Books</i></div><button class="gear" onclick="App.openSettings()">Settings</button></header>
  <div class="bizbar" id="bizbar"></div>
  <div class="content" id="content"></div>
  <div class="nav" id="nav"></div>
  <div id="sheetHost"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ===================== INDEXEDDB LAYER ===================== */
const DB_NAME = "kalamuBooksDB", DB_VER = 2;
const STORES = ["salesDocs","purchaseDocs","inventory","settings","businesses","bizCodes"];
let dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, DB_VER);
  req.onupgradeneeded = (e) => {
    const db = e.target.result;
    STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: "id" }); });
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
async function dbAll(store){
  const db = await dbPromise;
  return new Promise((res, rej) => {
    const tx = db.transaction(store, "readonly").objectStore(store).getAll();
    tx.onsuccess = () => res(tx.result || []);
    tx.onerror = () => rej(tx.error);
  });
}
async function dbPut(store, record){
  const db = await dbPromise;
  return new Promise((res, rej) => {
    const tx = db.transaction(store, "readwrite").objectStore(store).put(record);
    tx.onsuccess = () => res(record);
    tx.onerror = () => rej(tx.error);
  });
}
async function dbDel(store, id){
  const db = await dbPromise;
  return new Promise((res, rej) => {
    const tx = db.transaction(store, "readwrite").objectStore(store).delete(id);
    tx.onsuccess = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ n = Number(n)||0; return "KSh " + n.toLocaleString("en-KE",{maximumFractionDigits:0}); }
function today(){ return new Date().toISOString().slice(0,10); }
function niceDate(d){ const dt = new Date(d); return isNaN(dt) ? "—" : dt.toLocaleDateString("en-KE",{day:"numeric",month:"short",year:"numeric"}); }
function monthKey(d){ const dt = new Date(d); return isNaN(dt) ? "—" : dt.toLocaleDateString("en-KE",{month:"short",year:"2-digit"}); }
function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 1800); }

/* ===================== CONSTANTS ===================== */
const EXPENSE_CATEGORIES = ["Rent","Supplies","Transport","Utilities","Salaries","Marketing","Inventory Purchase","Professional fees","Other"];
const SALES_TYPES_BIZ = { invoice:"Invoice", receipt:"Sales Receipt", estimate:"Estimate", creditMemo:"Credit Memo" };
const SALES_TYPES_PERSONAL = { invoice:"Owed to me", receipt:"Income", estimate:"Expected income", creditMemo:"Refund" };
const PURCHASE_TYPES_BIZ = { expense:"Expense", bill:"Bill", po:"Purchase Order", claim:"Expense Claim" };
const PURCHASE_TYPES_PERSONAL = { expense:"Expense", bill:"Bill", po:"Planned expense", claim:"Reimbursement" };

const ICONS={dashboard:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',sales:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',purchases:'<path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 016 0"/>',inventory:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',reports:'<path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/>'};
/* ===================== STATE ===================== */
const App = {
  tab: "dashboard", q:"", pick:5, _anim:true, biz:null,
  salesSeg: "invoice",
  purchaseSeg: "expense",
  data: { salesDocs: [], purchaseDocs: [], inventory: [], settings: null, businesses: [], bizCodes: [] },

  async init(){
    const [sales, purch, inv, settingsArr, bizArr, codesArr] = await Promise.all([
      dbAll("salesDocs"), dbAll("purchaseDocs"), dbAll("inventory"), dbAll("settings"), dbAll("businesses"), dbAll("bizCodes")
    ]);
    this.data.salesDocs = sales.sort((a,b)=> new Date(b.date)-new Date(a.date));
    this.data.purchaseDocs = purch.sort((a,b)=> new Date(b.date)-new Date(a.date));
    this.data.inventory = inv;
    this.data.bizCodes = codesArr;
    this.data.businesses = bizArr;

    if (this.data.businesses.length === 0){
      const old = settingsArr[0] || null;
      const first = {
        id: "biz_" + uid(), name: (old && old.businessName) || "My Business", kind: "business", type: "standard",
        kraPin: (old && old.kraPin) || "", phone: (old && old.phone) || "",
        location: (old && old.location) || "Nairobi, Kenya", createdAt: today()
      };
      this.data.businesses = [first];
      await dbPut("businesses", first);
      for (const store of ["salesDocs","purchaseDocs","inventory"]){
        for (const rec of this.data[store]){
          if (!rec.bizId){ rec.bizId = first.id; await dbPut(store, rec); }
        }
      }
    }
    let saved = null;
    try { saved = localStorage.getItem("kalamuActiveBiz"); } catch(e){}
    this.biz = (saved && this.data.businesses.some(b=>b.id===saved)) ? saved : this.data.businesses[0].id;
    try { localStorage.setItem("kalamuActiveBiz", this.biz); } catch(e){}

    this.renderBizBar();
    this.renderNav();
    this.render();
  },

  go(tab){ if (tab==="inventory" && this.isPersonal()) tab="dashboard"; this.tab = tab; this.q=""; this._anim=true; if(navigator.vibrate) navigator.vibrate(8); this.render(); document.getElementById("content").scrollTop=0; },

  renderNav(){
    const L = this.isPersonal()
      ? {dashboard:"Home",sales:"Income",purchases:"Expenses",reports:"Reports"}
      : {dashboard:"Home",sales:"Sales",purchases:"Purchases",inventory:"Stock",reports:"Reports"};
    document.getElementById("nav").innerHTML = Object.keys(L).map(id=>`<button class="${this.tab===id?'active':''}" aria-label="${L[id]}" onclick="App.go('${id}')"><svg viewBox="0 0 24 24">${ICONS[id]}</svg>${L[id]}</button>`).join("");
  },
  renderBizBar(){
    const host = document.getElementById("bizbar"); if (!host) return;
    host.innerHTML = this.data.businesses.map(b=>{
      const icon = b.kind==='personal' ? '<svg class="picon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>'
        : (b.type==='vending' ? '<i class="vdot"></i>' : '');
      return `<button class="bizchip ${b.id===this.biz?'active':''}" onclick="App.switchBiz('${b.id}')">${icon}${esc(b.name)}</button>`;
    }).join("")
      + `<button class="bizadd" aria-label="Add business" onclick="App.openBizForm()">+</button>`;
  },
  currentBiz(){ return this.data.businesses.find(b=>b.id===this.biz) || this.data.businesses[0]; },
  switchBiz(id){
    if (id===this.biz) return;
    this.biz = id; try { localStorage.setItem("kalamuActiveBiz", id); } catch(e){}
    this.tab="dashboard"; this.q=""; this._anim=true;
    if (navigator.vibrate) navigator.vibrate(8);
    this.renderBizBar(); this.render();
    toast("Switched to " + this.currentBiz().name);
  },
  mySales(){ return this.data.salesDocs.filter(d=>d.bizId===this.biz); },
  myPurchases(){ return this.data.purchaseDocs.filter(d=>d.bizId===this.biz); },
  myInventory(){ return this.data.inventory.filter(d=>d.bizId===this.biz); },
  myCodes(){ return this.data.bizCodes.filter(c=>c.bizId===this.biz); },
  isPersonal(){ const b=this.currentBiz(); return !!b && b.kind==="personal"; },
  ST(){ return this.isPersonal() ? SALES_TYPES_PERSONAL : SALES_TYPES_BIZ; },
  PT(){ return this.isPersonal() ? PURCHASE_TYPES_PERSONAL : PURCHASE_TYPES_BIZ; },

  render(){
    this.renderNav();
    this.renderBizBar();
    const c = document.getElementById("content");
    if (this.tab==="dashboard") c.innerHTML = this.viewDashboard();
    else if (this.tab==="sales") c.innerHTML = this.viewSales();
    else if (this.tab==="purchases") c.innerHTML = this.viewPurchases();
    else if (this.tab==="inventory") c.innerHTML = this.viewInventory();
    else if (this.tab==="reports") c.innerHTML = this.viewReports();
    this.after();
  },

  hit(...v){ const q=this.q.trim().toLowerCase(); return !q || v.some(x=>(x||"").toString().toLowerCase().includes(q)); },
  searchBox(){ return `<input id="q" class="search" type="search" placeholder="Search" value="${esc(this.q)}" oninput="App.search(this.value)">`; },
  search(v){ this.q=v; this.render(); },
  quick(tab){ this.tab=tab; this.q=""; this._anim=true; if(tab==="sales") this.salesSeg="invoice"; if(tab==="purchases") this.purchaseSeg="expense"; this.render();
    ({sales:()=>this.openSalesForm(),purchases:()=>this.openPurchaseForm(),inventory:()=>this.openItemForm()})[tab](); },
  pickMonth(i){ this.pick=i; this.render(); },
  months(){
    const now=new Date(), m=[], key=d=>d.getFullYear()*12+d.getMonth();
    for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); m.push({k:key(d),l:d.toLocaleDateString("en-KE",{month:"short"}),in:0,out:0}); }
    const at=(date)=>{ const d=new Date(date); return isNaN(d)?null:m.find(x=>x.k===key(d)); };
    this.mySales().forEach(d=>{ const x=at(d.date); if(!x) return;
      if((d.type==="invoice"&&d.status==="paid")||d.type==="receipt") x.in+=Number(d.amount);
      else if(d.type==="creditMemo") x.in-=Number(d.amount); });
    this.myPurchases().forEach(d=>{ const x=at(d.date); if(x && d.type!=="po") x.out+=Number(d.amount); });
    m.forEach(x=>x.in=Math.max(0,x.in)); return m;
  },
  after(){
    const c=document.getElementById("content");
    const q=document.getElementById("q"); if(q && this.q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
    if(!this._anim) return; this._anim=false;
    c.classList.remove("in"); void c.offsetWidth; c.classList.add("in");
    if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    document.querySelectorAll(".bar").forEach(b=>{ const h=b.style.height; b.style.height="0"; requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.height=h)); });
    document.querySelectorAll("[data-v]").forEach(el=>{ const v=+el.dataset.v, t0=performance.now();
      const step=t=>{ const p=Math.min(1,(t-t0)/900); el.textContent=fmt(v*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); }; requestAnimationFrame(step); });
  },

  /* ---------- derived numbers ---------- */
  totals(){
    const s = this.mySales(), p = this.myPurchases();
    const income = s.filter(d => (d.type==="invoice" && d.status==="paid") || d.type==="receipt")
      .reduce((sum,d)=> sum + Number(d.amount), 0)
      - s.filter(d=>d.type==="creditMemo").reduce((sum,d)=> sum + Number(d.amount), 0);
    const due = s.filter(d => d.type==="invoice" && d.status!=="paid").reduce((sum,d)=> sum + Number(d.amount), 0);
    const expenses = p.filter(d => d.type==="expense" || d.type==="bill" || d.type==="claim")
      .reduce((sum,d)=> sum + Number(d.amount), 0);
    const inventoryValue = this.myInventory().reduce((sum,i)=> sum + Number(i.qty)*Number(i.unitCost||0), 0);
    return { income, due, expenses, net: income-expenses, inventoryValue };
  },

  /* ================= DASHBOARD ================= */
  viewDashboard(){
    const t=this.totals(), M=this.months(), mx=Math.max(1,...M.flatMap(m=>[m.in,m.out])), p=this.pick, cur=M[p];
    const low=this.myInventory().filter(i=>Number(i.qty)<=Number(i.lowStock||0));
    const recent=[...this.mySales(),...this.myPurchases()].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
    return `
      <section class="hero"><span class="lbl">${esc(this.currentBiz().name)} · Net profit, all time</span>
        <div class="big ${t.net<0?'neg':''}" data-v="${t.net}">${fmt(t.net)}</div>
        <div class="two"><div><span class="lbl">Income received</span><b data-v="${t.income}">${fmt(t.income)}</b></div>
        <div><span class="lbl">Expenses</span><b data-v="${t.expenses}">${fmt(t.expenses)}</b></div></div></section>
      <div class="quick"><button class="btn" onclick="App.quick('sales')">${this.isPersonal()?'Add income':'New invoice'}</button>
        <button class="btn ghost" onclick="App.quick('purchases')">${this.isPersonal()?'Add expense':'Log expense'}</button>
        ${this.isPersonal()?'':'<button class="btn ghost" onclick="App.quick(\'inventory\')">Add stock</button>'}</div>
      <div class="tiles"><div class="tile"><span class="lbl">Awaiting payment</span><b class="money">${fmt(t.due)}</b></div>
        ${this.isPersonal()?'':`<div class="tile"><span class="lbl">Stock value</span><b class="money">${fmt(t.inventoryValue)}</b></div>`}</div>

        <span class="bars"><i class="bar in" style="height:${m.in/mx*100}%"></i><i class="bar out" style="height:${m.out/mx*100}%"></i></span><em>${m.l}</em></button>`).join("")}</div>
      <p class="read"><b>${cur.l}</b><span class="dot" style="background:var(--ink)"></span>In ${fmt(cur.in)}<span class="dot" style="background:var(--ochre)"></span>Out ${fmt(cur.out)}</p>
      <h2 class="section">Recent activity</h2><p class="sub">Last 6 records</p>
      ${recent.length===0?`<div class="empty">Nothing yet. Add your first ${this.isPersonal()?"income or expense":"invoice or expense"}.</div>`:recent.map(r=>{
        const isSale=!!this.ST()[r.type], label=isSale?(r.client||"—"):(r.desc||r.party||"—");
        return `<div class="row-item"><div><div style="font-size:15px;font-weight:600">${esc(label)}</div>
          <div style="font-size:12px;color:var(--mute);margin-top:2px">${isSale?this.ST()[r.type]:this.PT()[r.type]} · ${niceDate(r.date)}</div></div>

  toggleSalesPaid(id){

    dbPut("salesDocs", d); this.render();
  },
  deleteSales(id){
    this.data.salesDocs = this.data.salesDocs.filter(x=>x.id!==id);
    dbDel("salesDocs", id); this.render(); toast("Deleted");
  },

  openSalesForm(){
    const type = this.salesSeg;
    const isCredit = type === "creditMemo";
    const isItemized = type==="invoice" || type==="receipt" || type==="estimate";
    const invoiceOptions = this.mySales().filter(d=>d.type==="invoice");
    const html = `
      <div class="sheet">
        <h3>New ${this.ST()[type]} <span class="x" onclick="App.closeSheet()">✕</span></h3>
        ${this.currentBiz().type==='vending' ? `
        <label class="field"><span>Quick code (optional)</span><input id="f_code" placeholder="e.g. MK1" oninput="App.applyCode(this.value)"></label>` : ``}
        <label class="field"><span>${this.isPersonal()?"From":"Client name"}</span><input id="f_client" placeholder="${this.isPersonal()?'e.g. Salary, M-Pesa from Mum':'e.g. Carrefour Santa Maria'}"></label>
        ${this.currentBiz().type==='vending' ? `
        <label class="field"><span>Location</span><input id="f_loc" placeholder="e.g. Mathare stage"></label>` : ``}
        ${isCredit ? `<label class="field"><span>Against invoice (optional)</span>
          <select id="f_link"><option value="">— none —</option>
          ${invoiceOptions.map(i=>`<option value="${i.id}">${esc(i.client)} · ${fmt(i.amount)} · ${niceDate(i.date)}</option>`).join("")}
          </select></label>` : ""}
        ${isItemized ? `
          <span style="font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--inkSoft)">Line items</span>
          <div id="itemsWrap" style="margin-top:6px"></div>
          <button class="btn ghost" style="margin-bottom:12px" onclick="App.addItemRow()">+ Add line</button>
          <label class="field"><input type="checkbox" id="f_vat" style="width:auto;display:inline-block;margin-right:6px">
            <span style="display:inline;text-transform:none;font-weight:500;color:var(--ink)">Add 16% VAT</span></label>
        ` : `<label class="field"><span>Amount (KSh)</span><input id="f_amount" type="number" placeholder="0"></label>`}
        <div class="grid2">
          <label class="field"><span>Date</span><input id="f_date" type="date" value="${today()}"></label>
          ${type==="invoice" ? `<label class="field"><span>Due date</span><input id="f_due" type="date"></label>` : "<div></div>"}
        </div>
        <label class="field"><span>Note (optional)</span><input id="f_note" placeholder="What's this for?"></label>
        <button class="btn" style="width:100%;padding:12px;font-size:13.5px" onclick="App.saveSalesForm('${type}', ${isItemized})">Save ${this.ST()[type]}</button>
      </div>`;
    document.getElementById("sheetHost").innerHTML = `<div class="sheet-overlay">${html}</div>`;
    if (isItemized) this.addItemRow();
  },
  applyCode(val){
    const code = val.trim().toLowerCase(); if (!code) return;
    const hit = this.myCodes().find(c=>c.code.toLowerCase()===code);
    if (hit){
      const clientEl = document.getElementById("f_client"), locEl = document.getElementById("f_loc");
      if (clientEl) clientEl.value = hit.customer;
      if (locEl && hit.location) locEl.value = hit.location;
      toast("Filled from code " + hit.code);
    }
  },
  addItemRow(){
    const wrap = document.getElementById("itemsWrap");
    const rid = uid();
    const row = document.createElement("div");
    row.className = "item-row"; row.id = "row_"+rid;
    row.innerHTML = `<input placeholder="Description" class="it_desc">
      <input placeholder="Qty" type="number" value="1" class="it_qty">
      <input placeholder="Price" type="number" class="it_price">
      <button class="icon-x" onclick="document.getElementById('row_${rid}').remove()">✕</button>`;
    wrap.appendChild(row);
  },
  saveSalesForm(type, isItemized){
    const client = document.getElementById("f_client").value.trim();
    if (!client) return toast("Client name is required");
    let amount = 0, items = [];
    if (isItemized){
      document.querySelectorAll("#itemsWrap .item-row").forEach(row=>{
        const desc = row.querySelector(".it_desc").value.trim();
        const qty = Number(row.querySelector(".it_qty").value)||0;
        const price = Number(row.querySelector(".it_price").value)||0;
        if (desc) { items.push({desc,qty,price}); amount += qty*price; }
      });
      const vat = document.getElementById("f_vat").checked;
      if (vat) amount = amount * 1.16;
    } else {
      amount = Number(document.getElementById("f_amount").value)||0;
    }
    const date = document.getElementById("f_date").value || today();
    const due = document.getElementById("f_due") ? document.getElementById("f_due").value : "";
    const note = document.getElementById("f_note").value.trim();
    const link = document.getElementById("f_link") ? document.getElementById("f_link").value : "";
    const location = document.getElementById("f_loc") ? document.getElementById("f_loc").value.trim() : "";
    const code = document.getElementById("f_code") ? document.getElementById("f_code").value.trim() : "";
    const doc = {
      id: uid(), bizId: this.biz, type, client, items, amount, date, dueDate: due, note, location, code: code || null,
      status: type==="invoice" ? "due" : "n/a", linkedTo: link || null
    };
    this.data.salesDocs.unshift(doc);
    dbPut("salesDocs", doc);
    this.closeSheet(); this.render(); toast(this.ST()[type] + " saved");
  },

  setPurchSeg(k){ this.purchaseSeg = k; this.render(); },
  deletePurchase(id){

  openPurchaseForm(){
    const type = this.purchaseSeg;
    const needsParty = type==="bill" || type==="po";
    const html = `
      <div class="sheet">
        <h3>New ${this.PT()[type]} <span class="x" onclick="App.closeSheet()">✕</span></h3>
        <label class="field"><span>Description</span><input id="p_desc" placeholder="e.g. Fuel for deliveries"></label>
        ${needsParty ? `<label class="field"><span>${type==='po'?'Supplier':'Vendor'} name</span><input id="p_party" placeholder="e.g. Java Coffee Roasters"></label>` : ""}
        <label class="field"><span>Category</span><select id="p_cat">${EXPENSE_CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select></label>
        <label class="field"><span>Amount (KSh)</span><input id="p_amount" type="number" placeholder="0"></label>
        <div class="grid2">
          <label class="field"><span>Date</span><input id="p_date" type="date" value="${today()}"></label>
          <label class="field"><span>${type==='po'?'Needed by':'Due date'} (optional)</span><input id="p_due" type="date"></label>
        </div>
        <label class="field"><span>Attach receipt photo (optional)</span>
          <input id="p_file" type="file" accept="image/*,application/pdf"></label>
        <div id="p_preview"></div>
        <button class="btn brick" style="width:100%;padding:12px;font-size:13.5px;margin-top:6px" onclick="App.savePurchaseForm('${type}')">Save ${this.PT()[type]}</button>
      </div>`;
    document.getElementById("sheetHost").innerHTML = `<div class="sheet-overlay">${html}</div>`;
    document.getElementById("p_file").addEventListener("change", (e)=>{
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        App._pendingAttachment = reader.result;
        if (file.type.startsWith("image/")) document.getElementById("p_preview").innerHTML = `<img class="thumb" src="${reader.result}">`;
        else document.getElementById("p_preview").innerHTML = `<p style="font-size:11px;color:var(--inkSoft)">📎 ${esc(file.name)} attached</p>`;
      };
      reader.readAsDataURL(file);
    });
  },
  savePurchaseForm(type){
    const desc = document.getElementById("p_desc").value.trim();
    if (!desc) return toast("Description is required");
    const party = document.getElementById("p_party") ? document.getElementById("p_party").value.trim() : "";
    const category = document.getElementById("p_cat").value;
    const amount = Number(document.getElementById("p_amount").value)||0;
    const date = document.getElementById("p_date").value || today();
    const due = document.getElementById("p_due").value;
    const doc = { id: uid(), bizId: this.biz, type, desc, party, category, amount, date, dueDate: due, attachment: App._pendingAttachment || null };
    App._pendingAttachment = null;
    this.data.purchaseDocs.unshift(doc);
    dbPut("purchaseDocs", doc);
    this.closeSheet(); this.render(); toast(this.PT()[type] + " saved");
  },

  /* ================= INVENTORY ================= */
  viewInventory(){

      <div class="hdr-row"><div><h2 class="section">Stock</h2><p class="sub">${inv.length} items</p></div>

        return `<div class="card">
          <div class="hdr-row" style="margin-bottom:0">

  },

          <button class="btn" onclick="Backup.exportAll()">Backup now</button>
          <label class="btn ghost" style="display:inline-block;cursor:pointer">Restore
            <input type="file" accept="application/json" style="display:none" onchange="Backup.importAll(event)"></label>
        </div>
      </div>
    `;
  },

  /* ---------- settings sheet ---------- */
  openSettings(){
    const s = this.currentBiz(), codes = this.myCodes(), isBiz = s.kind!=="personal";
    const html = `<div class="sheet"><h3>${esc(s.name)} <span class="x" onclick="App.closeSheet()">✕</span></h3>
      <p style="font-size:11px;color:var(--inkSoft);margin-top:-6px">${isBiz?"Business account · shown on your PDFs":"Personal account"}</p>
      <label class="field"><span>${isBiz?"Business name":"Account name"}</span><input id="s_name" value="${esc(s.name)}"></label>
      ${isBiz ? `<label class="field"><span>Business type</span><select id="s_type">
        <option value="standard" ${s.type!=='vending'?'selected':''}>Standard (fixed location)</option>
        <option value="vending" ${s.type==='vending'?'selected':''}>Vending / mobile (locations &amp; customers change often)</option>
      </select></label>
      <label class="field"><span>KRA PIN (optional)</span><input id="s_pin" value="${esc(s.kraPin)}"></label>` : ``}
      <label class="field"><span>Phone</span><input id="s_phone" value="${esc(s.phone)}"></label>
      <label class="field"><span>Location</span><input id="s_loc" value="${esc(s.location)}"></label>
      <button class="btn" style="width:100%;padding:12px;font-size:13.5px" onclick="App.saveSettings()">Save</button>
      ${isBiz && s.type==='vending' ? `
      <h3 style="font-size:20px;margin:22px 0 10px">Vendor codes</h3>
      <p style="font-size:11px;color:var(--inkSoft);margin-top:-6px">Save a short code per stop or customer, then type it in Sales to fill in the client and location instantly.</p>
      <div id="codesList">${codes.length===0?`<p style="font-size:12px;color:var(--inkSoft)">No codes yet.</p>`:codes.map(c=>`
        <div class="row-item"><div><b style="font-size:13px">${esc(c.code)}</b>
          <div style="font-size:11px;color:var(--inkSoft)">${esc(c.customer)}${c.location?' · '+esc(c.location):''}</div></div>
          <button class="icon-x" onclick="App.deleteCode('${c.id}')">✕</button></div>`).join("")}</div>
      <div class="grid2" style="margin-top:10px">
        <input id="c_code" placeholder="Code e.g. MK1">
        <input id="c_customer" placeholder="Customer">
      </div>
      <input id="c_loc" placeholder="Location (optional)" style="margin-top:8px">
      <button class="btn ghost" style="width:100%;padding:11px;font-size:13px;margin-top:8px" onclick="App.saveCode()">+ Add code</button>
      ` : ``}
      ${this.data.businesses.length>1 ? `
      <button class="btn brick" style="width:100%;padding:11px;font-size:13px;margin-top:26px" onclick="App.deleteBiz()">Delete this account</button>
      <p style="font-size:10.5px;color:var(--inkSoft);margin-top:6px">Permanently deletes ${esc(s.name)} and every record filed under it. This can't be undone — back up first if unsure.</p>
      ` : `<p style="font-size:10.5px;color:var(--inkSoft);margin-top:22px">You need at least one account, so this one can't be deleted yet.</p>`}
    </div>`;
    document.getElementById("sheetHost").innerHTML = `<div class="sheet-overlay">${html}</div>`;
  },
  saveSettings(){
    const cur = this.currentBiz(), isBiz = cur.kind!=="personal";
    const s = { ...cur,
      name: document.getElementById("s_name").value.trim() || (isBiz?"My Business":"Personal"),
      phone: document.getElementById("s_phone").value.trim(),
      location: document.getElementById("s_loc").value.trim() || "Nairobi, Kenya"
    };
    if (isBiz){
      s.type = document.getElementById("s_type").value;
      s.kraPin = document.getElementById("s_pin").value.trim();
    }
    const i = this.data.businesses.findIndex(b=>b.id===s.id);
    this.data.businesses[i] = s; dbPut("businesses", s);
    this.closeSheet(); this.renderBizBar(); this.render(); toast("Saved");
  },
  deleteBiz(){
    if (this.data.businesses.length<=1) return;
    const s = this.currentBiz();
    const typed = prompt(`Type "${s.name}" to permanently delete this account and all its records:`);
    if (typed !== s.name) { if (typed!==null) toast("Name didn't match — nothing deleted"); return; }
    const id = s.id;
    this.data.salesDocs.filter(d=>d.bizId===id).forEach(d=>dbDel("salesDocs", d.id));
    this.data.purchaseDocs.filter(d=>d.bizId===id).forEach(d=>dbDel("purchaseDocs", d.id));
    this.data.inventory.filter(d=>d.bizId===id).forEach(d=>dbDel("inventory", d.id));
    this.data.bizCodes.filter(c=>c.bizId===id).forEach(c=>dbDel("bizCodes", c.id));
    this.data.salesDocs = this.data.salesDocs.filter(d=>d.bizId!==id);
    this.data.purchaseDocs = this.data.purchaseDocs.filter(d=>d.bizId!==id);
    this.data.inventory = this.data.inventory.filter(d=>d.bizId!==id);
    this.data.bizCodes = this.data.bizCodes.filter(c=>c.bizId!==id);
    this.data.businesses = this.data.businesses.filter(b=>b.id!==id);
    dbDel("businesses", id);
    const next = this.data.businesses[0];
    this.biz = next.id; try { localStorage.setItem("kalamuActiveBiz", this.biz); } catch(e){}
    this.tab = "dashboard";
    this.closeSheet(); this.renderBizBar(); this.render();
    toast(s.name + " deleted");
  },
  saveCode(){
    const code = document.getElementById("c_code").value.trim();
    const customer = document.getElementById("c_customer").value.trim();
    if (!code || !customer) return toast("Code and customer are required");
    const loc = document.getElementById("c_loc").value.trim();
    const rec = { id: uid(), bizId: this.biz, code, customer, location: loc };
    this.data.bizCodes.push(rec); dbPut("bizCodes", rec);
    this.openSettings(); toast("Code saved");
  },
  deleteCode(id){
    this.data.bizCodes = this.data.bizCodes.filter(c=>c.id!==id);
    dbDel("bizCodes", id); this.openSettings(); toast("Code removed");
  },
  openBizForm(){
    const html = `<div class="sheet"><h3>New account <span class="x" onclick="App.closeSheet()">✕</span></h3>
      <label class="field"><span>What is this for?</span><select id="nb_kind" onchange="App.toggleNbKind(this.value)">
        <option value="business">A business</option>
        <option value="personal">My personal finances</option>
      </select></label>
      <label class="field"><span>Account name</span><input id="nb_name" placeholder="e.g. Tabasamu Sips"></label>
      <div id="nb_typeWrap"><label class="field"><span>Business type</span><select id="nb_type">
        <option value="standard">Standard (fixed location)</option>
        <option value="vending">Vending / mobile (locations &amp; customers change often)</option>
      </select></label></div>
      <label class="field"><span>Location</span><input id="nb_loc" placeholder="e.g. Nairobi, Kenya"></label>
      <label class="field"><span>Phone (optional)</span><input id="nb_phone"></label>
      <p style="font-size:11px;color:var(--inkSoft)">Your other accounts and their records stay exactly as they are — this adds a separate one you can switch to.</p>
      <button class="btn" style="width:100%;padding:12px;font-size:13.5px" onclick="App.saveBizForm()">Create account</button>
    </div>`;
    document.getElementById("sheetHost").innerHTML = `<div class="sheet-overlay">${html}</div>`;
  },
  toggleNbKind(v){ const w=document.getElementById("nb_typeWrap"); if (w) w.style.display = v==="personal" ? "none" : "block"; },
  saveBizForm(){
    const name = document.getElementById("nb_name").value.trim();
    if (!name) return toast("Account name is required");
    const kind = document.getElementById("nb_kind").value;
    const biz = {
      id: "biz_" + uid(), name, kind,
      kraPin: "", phone: document.getElementById("nb_phone").value.trim(),
      location: document.getElementById("nb_loc").value.trim() || "Nairobi, Kenya", createdAt: today()
    };
    if (kind!=="personal") biz.type = document.getElementById("nb_type").value;
    this.data.businesses.push(biz); dbPut("businesses", biz);
    this.closeSheet(); this.switchBiz(biz.id); toast(name + " created");
  },

  closeSheet(){ document.getElementById("sheetHost").innerHTML = ""; }
};

/* ===================== PDF GENERATION ===================== */
const PDF = {
  letterhead(doc, title){
    const s = App.currentBiz();
    doc.setFont("helvetica","bold"); doc.setFontSize(16);
    doc.setTextColor(27,58,47); doc.text(s.name, 14, 18);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(90,83,70);
    doc.text(`${s.location}${s.phone ? ' · '+s.phone : ''}${s.kraPin ? ' · KRA PIN: '+s.kraPin : ''}`, 14, 24);
    doc.setDrawColor(217,208,187); doc.line(14, 28, 196, 28);
    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(33,29,24);
    doc.text(title, 14, 38);
  },
  footer(doc){
    doc.setFontSize(8); doc.setTextColor(150,140,120);
    doc.text("Generated with Kalamu Books · " + new Date().toLocaleString("en-KE"), 14, 287);
  },
  save(doc, filename){ doc.save(filename); toast("PDF saved"); },

  salesDoc(id){
    const d = App.data.salesDocs.find(x=>x.id===id); if(!d) return;
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    this.letterhead(doc, App.ST()[d.type].toUpperCase());
    doc.setFontSize(10); doc.setTextColor(33,29,24);
    doc.text(`Bill to: ${d.client}`, 14, 48);
    doc.text(`Date: ${niceDate(d.date)}`, 140, 48);
    if (d.dueDate) doc.text(`Due: ${niceDate(d.dueDate)}`, 140, 54);
    if (d.note) doc.text(`Note: ${d.note}`, 14, 54);
    let y = 64;
    if (d.items && d.items.length){
      doc.autoTable({
        startY: y,
        head: [["Description","Qty","Price","Amount"]],
        body: d.items.map(i=>[i.desc, i.qty, fmt(i.price), fmt(i.qty*i.price)]),
        theme: "grid", headStyles: { fillColor: [27,58,47] }, styles: { fontSize: 9 }
      });
      y = doc.lastAutoTable.finalY + 10;
    }
    doc.setFont("helvetica","bold"); doc.setFontSize(12);
    doc.text(`Total: ${fmt(d.amount)}`, 14, y);
    if (d.type==="invoice"){
      doc.setFontSize(10);
      if (d.status==="paid") doc.setTextColor(76,122,90); else doc.setTextColor(161,59,44);
      doc.text(`Status: ${d.status==="paid"?"PAID":"DUE"}`, 14, y+8);
    }
    this.footer(doc);
    this.save(doc, `${App.ST()[d.type]}_${d.client}_${d.date}.pdf`.replace(/\s+/g,"_"));
  },

  purchaseDoc(id){
    const d = App.data.purchaseDocs.find(x=>x.id===id); if(!d) return;
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    this.letterhead(doc, App.PT()[d.type].toUpperCase());
    doc.setFontSize(10); doc.setTextColor(33,29,24);
    let y = 48;
    if (d.party){ doc.text(`Vendor/Supplier: ${d.party}`, 14, y); y += 6; }
    doc.text(`Description: ${d.desc}`, 14, y); y += 6;
    doc.text(`Category: ${d.category}`, 14, y); y += 6;
    doc.text(`Date: ${niceDate(d.date)}`, 14, y); y += 6;
    if (d.dueDate){ doc.text(`Due: ${niceDate(d.dueDate)}`, 14, y); y += 6; }
    doc.setFont("helvetica","bold"); doc.setFontSize(12);
    doc.text(`Amount: ${fmt(d.amount)}`, 14, y+4);
    y += 16;
    if (d.attachment && d.attachment.startsWith("data:image")){
      try { doc.addImage(d.attachment, "JPEG", 14, y, 80, 60); } catch(e){}
    } else if (d.attachment){
      doc.setFontSize(9); doc.setTextColor(90,83,70); doc.text("Attachment on file (non-image, not embedded).", 14, y);
    }
    this.footer(doc);
    this.save(doc, `${App.PT()[d.type]}_${d.desc}_${d.date}.pdf`.replace(/\s+/g,"_"));
  },

  profitLoss(){
    const t = App.totals();
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    this.letterhead(doc, "PROFIT & LOSS STATEMENT");
    doc.autoTable({
      startY: 48,
      body: [
        ["Income received", fmt(t.income)],
        ["Total expenses", fmt(t.expenses)],
        ["Net profit", fmt(t.net)],
      ],
      theme: "plain", styles: { fontSize: 11 },
      columnStyles: { 1: { halign: "right", fontStyle: "bold" } }
    });
    this.footer(doc);
    this.save(doc, `Profit_Loss_${today()}.pdf`);
  },

  balanceSheet(){
    const t = App.totals();
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    this.letterhead(doc, "BALANCE SHEET");
    doc.autoTable({
      startY: 48,
      head: [["Assets","Amount"]],
      body: [
        ["Cash (income − expenses)", fmt(t.net)],
        ["Inventory value", fmt(t.inventoryValue)],
        ["Accounts receivable (owed to you)", fmt(t.due)],
        ["Total assets", fmt(t.net + t.inventoryValue + t.due)],
      ],
      theme: "grid", headStyles: { fillColor: [27,58,47] }, styles: { fontSize: 10 }
    });
    this.footer(doc);
    this.save(doc, `Balance_Sheet_${today()}.pdf`);
  },

  ledger(){
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    this.letterhead(doc, "GENERAL LEDGER");
    const rows = [
      ...App.mySales().map(d=>[niceDate(d.date), App.ST()[d.type], d.client, "+" + fmt(d.amount).replace("KSh ","")]),
      ...App.myPurchases().map(d=>[niceDate(d.date), App.PT()[d.type], d.desc, "-" + fmt(d.amount).replace("KSh ","")]),
    ].sort((a,b)=> new Date(a[0]) - new Date(b[0]));
    doc.autoTable({
      startY: 48, head: [["Date","Type","Description","Amount (KSh)"]], body: rows,
      theme: "striped", headStyles: { fillColor: [27,58,47] }, styles: { fontSize: 8.5 }
    });
    this.footer(doc);
    this.save(doc, `Ledger_${today()}.pdf`);
  },

  customerStatement(client){
    if (!client) return;
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    this.letterhead(doc, "CUSTOMER STATEMENT — " + client.toUpperCase());
    const docs = App.mySales().filter(d=>d.client===client).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const balance = docs.filter(d=>d.type==="invoice" && d.status!=="paid").reduce((s,d)=>s+Number(d.amount),0);
    doc.autoTable({
      startY: 48, head: [["Date","Type","Amount","Status"]],
      body: docs.map(d=>[niceDate(d.date), App.ST()[d.type], fmt(d.amount), d.type==="invoice" ? d.status : "—"]),
      theme: "grid", headStyles: { fillColor: [27,58,47] }, styles: { fontSize: 9 }
    });
    const y = doc.lastAutoTable.finalY + 10;
    doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.text(`Outstanding balance: ${fmt(balance)}`, 14, y);
    this.footer(doc);
    this.save(doc, `Statement_${client}_${today()}.pdf`.replace(/\s+/g,"_"));
  }
};

/* ===================== BACKUP / RESTORE ===================== */
const Backup = {
  async exportAll(){
    const payload = {
      version: 1, exportedAt: new Date().toISOString(),
      salesDocs: App.data.salesDocs, purchaseDocs: App.data.purchaseDocs,
      inventory: App.data.inventory, settings: App.data.settings,
      businesses: App.data.businesses, bizCodes: App.data.bizCodes
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `KalamuBooks_Backup_${today()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("Backup downloaded");
  },
  async importAll(event){
    const file = event.target.files[0]; if (!file) return;
    const text = await file.text();
    try {
      const payload = JSON.parse(text);
      if (!confirm("This will replace all current records with the backup file. Continue?")) return;
      for (const s of STORES) {
        const db = await dbPromise;
        await new Promise((res,rej)=>{ const tx = db.transaction(s,"readwrite").objectStore(s).clear(); tx.onsuccess=res; tx.onerror=rej; });
      }
      for (const rec of payload.salesDocs||[]) await dbPut("salesDocs", rec);
      for (const rec of payload.purchaseDocs||[]) await dbPut("purchaseDocs", rec);
      for (const rec of payload.inventory||[]) await dbPut("inventory", rec);
      for (const rec of payload.businesses||[]) await dbPut("businesses", rec);
      for (const rec of payload.bizCodes||[]) await dbPut("bizCodes", rec);
      if (payload.settings) await dbPut("settings", payload.settings);
      await App.init();
      toast("Backup restored");
    } catch(e){
      alert("That file couldn't be read as a Kalamu Books backup.");
    }
  }
};

document.addEventListener("click",e=>{ if(e.target.classList.contains("sheet-overlay")) App.closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") App.closeSheet(); });
App.init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("Service worker failed:", err));
  });
}
